name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack project
        run: unzip -q tasko-app.zip -d work

      - name: Install packages
        working-directory: work/tasko-app
        run: npm install

      - name: Prepare Android project
        working-directory: work/tasko-app
        run: npm run setup

      - name: Build APK
        working-directory: work/tasko-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tasko-apk
          path: work/tasko-app/android/app/build/outputs/apk/debug/app-debug.apk
